name: publish

# Publishes to npm through GitHub's OIDC identity -- no npm token anywhere.
#
# **Manual only, on purpose.** This used to fire on every `v*` tag, which meant
# pushing a tag published a release whether or not that was intended. The maintainer
# publishes from a local `npm publish` instead, so the tag is now just a marker of
# what shipped and this workflow runs only when dispatched by hand.
#
# Why keep it at all: it is the fallback for the day the local npm credential is
# dead. OIDC needs no token, so it keeps working when a stored one has expired --
# which is exactly the failure this project hit twice.
#
# One-time setup on npmjs.com: package -> Settings -> Trusted Publisher ->
# GitHub Actions, with
#     Organization or user : 27painter
#     Repository           : dsh-moli
#     Workflow filename    : publish.yml
#     Environment          : (leave empty)
# and allow the `npm publish` action.
#
# The tag and package.json must agree, or the published version is a lie, so the
# version check below still runs. Note that a local `npm publish` produces no
# provenance; only this workflow does.

on:
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # The tag and package.json must agree, or the published version is a lie.
      - name: Version matches the tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      # empty-verify only: it drives compiled stub engines, so it needs neither the
      # network nor a DSH install. schema-verify is deliberately NOT run here --
      # it imports the registry's validator out of `@deepseek-ai/dsh`, which this
      # job does not install, and a release should not depend on that. It runs in
      # .github/workflows/verify.yml, which does install it.
      #
      # The plugin imports `@deepseek-ai/schemastery` for its live Config schema,
      # so empty-verify needs the plugin's own dependencies in the checkout.
      - name: Install plugin dependencies
        run: npm install --no-audit --no-fund

      - name: Verify (no engine, no network)
        run: node verify/empty-verify.mjs

      - name: Publish
        run: npm publish
