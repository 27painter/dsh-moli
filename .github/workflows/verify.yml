# name: verify
#
# Every pull request so far was verified by hand. The suites exist but nothing ran
# them, which is how a Windows-only default and a head-only truncation both
# shipped. Three tiers fix that:
#
#   core    - schema-verify, empty-verify and report-verify need no engine and no
#             network. They cover the failure classes that actually shipped (an
#             output schema the registry rejects, a successful-but-empty fetch
#             reported as an error, and a one-shot regression), so they run
#             everywhere and must pass.
#   engine  - install-verify, win-verify and linux-verify drive real moli. A
#             runner has none installed, so these are attempted and only their
#             actual failures fail the job; "engine not found" is reported as a
#             skip instead of a red build that hides real breakage.
#   session - the interactive browser suites, which need Node >= 21 for the
#             built-in WebSocket. They spawn moli when it is present and a real
#             Chromium when the runner has one, skipping what is unavailable. The
#             runner image ships Chrome, so the browser paths are exercised for
#             real here rather than only on a developer machine -- which is the
#             entire reason the second backend exists.
#
# Add the CI-only dependencies here as they appear.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The plugin itself needs >= 20.12, but DSH's own dependency tree needs
          # more: on Node 20.12 `npm install -g @deepseek-ai/dsh` warns EBADENGINE
          # for commander@15 (>= 22.12.0), undici@8 (>= 22.19.0) and others.
          node-version: '22'

      # schema-verify imports the registry's own validator out of the DSH install
      # (`@deepseek-ai/dsh-tools`), because the plain `ctx.tools.register` path is
      # where two registration failures shipped from. It is not a dependency of the
      # plugin -- the plugin has none -- so CI installs it here. The lookup asks
      # `npm root -g`: on this runner `npm prefix -g` reports the Node install
      # directory, so building the path from the prefix missed a tree npm had just
      # populated.
      - name: Install DSH (provides the registry validator)
        run: npm install -g @deepseek-ai/dsh

      # Printed deliberately. A lookup failure used to cost a round trip through
      # the logs to learn where npm had actually put the tree; this makes the
      # answer part of the run output.
      - name: Global install layout
        shell: bash
        run: |
          echo "npm root -g    : $(npm root -g)"
          echo "npm prefix -g  : $(npm prefix -g)"
          echo "@deepseek-ai   : $(ls "$(npm root -g)/@deepseek-ai" 2>&1 | tr '\n' ' ')"

      # The c stub engines are compiled by the test itself; fail early with a
      # clear message if the runner has no compiler.
      - name: Compiler present
        shell: bash
        run: cc --version || gcc --version

      - name: schema-verify (registry's own validator)
        run: node verify/schema-verify.mjs

      - name: empty-verify (successful fetch with no output)
        run: node verify/empty-verify.mjs

      - name: report-verify (findings from a usage report)
        run: node verify/report-verify.mjs

  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install-verify (download routes against a loopback server)
        shell: bash
        run: |
          set -o pipefail
          out=$(node verify/install-verify.mjs 2>&1) && { echo "$out"; exit 0; }
          echo "$out"
          if echo "$out" | grep -qiE 'moli .*not found|was not found|no working moli|ENOENT'; then
            echo "::notice::no moli engine on this runner; install-verify skipped"
            exit 0
          fi
          exit 1

      - name: win-verify (Windows install paths and proxy prelude)
        shell: bash
        run: |
          set -o pipefail
          out=$(node verify/win-verify.mjs 2>&1) && { echo "$out"; exit 0; }
          echo "$out"
          if echo "$out" | grep -qiE 'moli .*not found|was not found|no working moli|ENOENT'; then
            echo "::notice::no moli engine on this runner; win-verify skipped"
            exit 0
          fi
          exit 1

      - name: linux-verify (POSIX engine discovery and proxy env)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          out=$(node verify/linux-verify.mjs 2>&1) && { echo "$out"; exit 0; }
          echo "$out"
          if echo "$out" | grep -qiE 'moli .*not found|was not found|no working moli|ENOENT'; then
            echo "::notice::no moli engine on this runner; linux-verify skipped"
            exit 0
          fi
          exit 1

  session:
    name: session (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Node 24, not 22: the session tool uses the built-in WebSocket, which
      # arrived in 21, and this also matches the publish workflow.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Reported so a run says which browser answered rather than leaving it to be
      # inferred from which assertions were skipped.
      - name: Browsers available
        shell: bash
        run: |
          for c in google-chrome google-chrome-stable chromium chromium-browser microsoft-edge; do
            command -v "$c" && "$c" --version 2>&1 || true
          done
          ls "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" 2>/dev/null || true
          ls "/c/Program Files/Google/Chrome/Application/chrome.exe" 2>/dev/null || true

      # The suite drives a real moli when one exists and skips otherwise, so the
      # moli half of the comparison is a skip rather than a failure on a runner
      # that has no engine.
      - name: session-verify (moli backend, full action surface)
        run: node verify/session-verify.mjs

      # This one is the point: it asserts that moli refuses to click below the
      # viewport and that a real Chromium does not. If no browser is present the
      # chromium half is skipped and the run still passes.
      - name: session-backends (moli versus Chromium geometry)
        run: node verify/session-backends.mjs

      # Starts its own external browser and attaches to it, so it also skips when
      # the machine has no Chromium-family browser. It checks the ownership rules:
      # a browser this plugin did not start is never stopped by `close`.
      - name: session-attach-verify (external endpoints and browser ownership)
        run: node verify/session-attach-verify.mjs
